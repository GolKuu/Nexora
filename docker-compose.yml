services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kase}
      POSTGRES_DB: ${POSTGRES_DB:-kase_bond_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kase} -d ${POSTGRES_DB:-kase_bond_ai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kase}:${POSTGRES_PASSWORD:-kase}@db:5432/${POSTGRES_DB:-kase_bond_ai}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      KASE_DATA_MODE: ${KASE_DATA_MODE:-mock}
      KASE_API_KEY: ${KASE_API_KEY:-}
      KASE_API_URL: ${KASE_API_URL:-https://api.kase.kz}
      KASE_WEBSITE_URL: ${KASE_WEBSITE_URL:-https://kase.kz}
      KASE_LANGUAGE: ${KASE_LANGUAGE:-ru}
      BROWSER_ENABLED: ${BROWSER_ENABLED:-true}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_ARTIFACT_DIR: ${BROWSER_ARTIFACT_DIR:-/app/var/browser}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_ENABLED: ${AI_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Loads synthetic demo data on first start. Ignored when APP_ENV=production.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
