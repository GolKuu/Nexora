services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kase}
      POSTGRES_DB: ${POSTGRES_DB:-kase_bond_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kase} -d ${POSTGRES_DB:-kase_bond_ai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kase}:${POSTGRES_PASSWORD:-kase}@db:5432/${POSTGRES_DB:-kase_bond_ai}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      KASE_DATA_MODE: ${KASE_DATA_MODE:-mock}
      KASE_API_KEY: ${KASE_API_KEY:-}
      KASE_API_URL: ${KASE_API_URL:-https://api.kase.kz}
      KASE_WEBSITE_URL: ${KASE_WEBSITE_URL:-https://kase.kz}
      KASE_LANGUAGE: ${KASE_LANGUAGE:-ru}
      BROWSER_ENABLED: ${BROWSER_ENABLED:-true}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_ARTIFACT_DIR: ${BROWSER_ARTIFACT_DIR:-/app/var/browser}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      KASE_AI_URL: http://ai:8100
      KASE_AI_MODEL_VERSION: ${KASE_AI_MODEL_VERSION:-kase-ai-v0.1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Loads synthetic demo data on first start. Ignored when APP_ENV=production.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      KASE_AI_RUNTIME: ${KASE_AI_RUNTIME:-rules}
      KASE_AI_SERVICE_MODEL_VERSION: ${KASE_AI_MODEL_VERSION:-kase-ai-v0.1}
      # The AI may refresh facts itself, but only from the verified public
      # JSON API on the official KASE host. No key or paid service is used.
      KASE_AI_DATA_MODE: ${KASE_AI_DATA_MODE:-live}
      KASE_AI_KASE_URL: ${KASE_WEBSITE_URL:-https://kase.kz}
      KASE_AI_KASE_LANGUAGE: ${KASE_LANGUAGE:-ru}
      KASE_AI_KASE_TIMEOUT: ${KASE_HTTP_TIMEOUT:-20}
      KASE_AI_LIVE_TTL_SECONDS: ${KASE_AI_LIVE_TTL_SECONDS:-300}
    volumes:
      - ai_logs:/app/var/ai-logs
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
  ai_logs:
