[pytest]
testpaths = tests
pythonpath = backend
addopts = -q --strict-markers
markers =
    live_kase: hits the real KASE endpoint; only runs when RUN_LIVE_KASE_TESTS=true
    live_browser: drives a real browser against kase.kz; only runs when RUN_LIVE_BROWSER_TESTS=true
filterwarnings =
    ignore::DeprecationWarning
