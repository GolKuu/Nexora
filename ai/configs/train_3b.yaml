# Small tier: development, CI smoke runs and the CPU-fallback deployment.
# Named train_3b for continuity with the plan; the actual checkpoint is 4B
# because Qwen3's small tier is 4B and shares the 8B tokenizer/template.
#
#   python -m ai.training.train_lora --config ai/configs/train_3b.yaml
#   python -m ai.training.train_lora --config ai/configs/train_3b.yaml --smoke

run:
  name: kase-ai-4b
  seed: 20260813
  output_dir: models/kase-ai-4b-v0.1
  record_git_commit: true

model:
  base: Qwen/Qwen3-4B
  base_key: qwen3-4b
  trust_remote_code: false
  attn_implementation: sdpa       # no flash-attn requirement on dev machines
  torch_dtype: bfloat16
  chat_template: tokenizer

quantization:
  enabled: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  enabled: true
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  modules_to_save: []

dataset:
  version: v0.1.0
  train_file: data/ai/sft/v0.1.0/train.jsonl
  eval_file: data/ai/sft/v0.1.0/dev.jsonl
  contamination_guard: ai/evaluation/golden/golden.jsonl
  max_seq_length: 2048
  packing: false
  train_on_completions_only: true

training:
  epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 0.3
  optim: paged_adamw_8bit
  bf16: true
  gradient_checkpointing: true
  logging_steps: 5
  eval_steps: 50
  save_steps: 50
  save_total_limit: 3
  checkpoint_interval_minutes: 30

# --smoke overrides: 32 samples, 1 epoch, no eval. Exists so the training code
# path is exercised in CI on any machine that has torch, without a GPU claim.
smoke:
  max_train_samples: 32
  epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  max_seq_length: 512
  save_steps: 999999

evaluation:
  benchmark: ai/evaluation/golden/golden.jsonl
  thresholds:
    tool_selection_accuracy_min: 0.85
    argument_f1_min: 0.80
    json_validity_min: 0.95
    hallucination_rate_max: 0.08
    refusal_accuracy_min: 0.85
    forbidden_phrase_rate_max: 0.0
