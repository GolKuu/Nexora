# QLoRA SFT for the MVP model: kase-ai-8b.
# Target hardware: 1x 24 GB (RTX 4090 / A10G / L4-48 halves fine too).
#
# Run:
#   python -m ai.training.train_lora --config ai/configs/train_8b.yaml

run:
  name: kase-ai-8b
  seed: 20260813
  output_dir: models/kase-ai-8b-v0.1
  # Written into metadata.json for reproducibility (§31).
  record_git_commit: true

model:
  base: Qwen/Qwen3-8B
  base_key: qwen3-8b              # must exist in configs/base_models.yaml
  trust_remote_code: false
  attn_implementation: flash_attention_2
  torch_dtype: bfloat16
  # Chat template comes from the base tokenizer; our role/section conventions
  # are in ai/prompts/templates.py and are asserted at prepare time.
  chat_template: tokenizer

quantization:                      # QLoRA
  enabled: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  enabled: true
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  modules_to_save: []             # tokenizer unchanged -> no embedding resize

dataset:
  version: v0.1.0                 # data/ai/sft/v0.1.0
  train_file: data/ai/sft/v0.1.0/train.jsonl
  eval_file: data/ai/sft/v0.1.0/dev.jsonl
  # Golden set is NEVER trained on. validate_dataset.py fails the run if any
  # golden prompt hash appears in train (§34, §57).
  contamination_guard: ai/evaluation/golden/golden.jsonl
  max_seq_length: 4096
  packing: false                  # loss masking on prompt tokens needs no packing
  train_on_completions_only: true

training:
  epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16 # effective batch 32
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 0.3
  optim: paged_adamw_8bit
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 5
  checkpoint_interval_minutes: 30

evaluation:
  # Gate before anything is promoted (§65).
  benchmark: ai/evaluation/golden/golden.jsonl
  thresholds:
    tool_selection_accuracy_min: 0.90
    argument_f1_min: 0.85
    json_validity_min: 0.98
    hallucination_rate_max: 0.05
    refusal_accuracy_min: 0.90
    forbidden_phrase_rate_max: 0.0
